name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:challenges
      - run: npm run validate:content
      - run: npm run test:levels
      - run: npm test
      - run: npm run lint
      - run: npm run check
      - run: npm run build
